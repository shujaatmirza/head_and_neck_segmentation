<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A: Dark Botanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   DARK BOTANICAL — Elegant, sophisticated, premium
   Warm accents on deep black. Abstract soft shapes.
   =========================================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-primary: #0f0f0f;
    --text-primary: #e8e4df;
    --text-secondary: #9a9590;
    --accent-warm: #d4a574;
    --accent-pink: #e8b4b8;
    --accent-gold: #c9b896;
    --title-size: clamp(2rem, 6vw, 4.5rem);
    --subtitle-size: clamp(0.9rem, 1.8vw, 1.2rem);
    --slide-padding: clamp(2rem, 5vw, 5rem);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}

html, body { height: 100%; overflow: hidden; }

body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
}

.slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: var(--slide-padding);
    position: relative;
}

/* Abstract soft gradient circles */
.orb-1 {
    position: absolute;
    width: clamp(200px, 40vw, 500px);
    height: clamp(200px, 40vw, 500px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 165, 116, 0.15) 0%, transparent 70%);
    top: 10%;
    right: 5%;
    filter: blur(60px);
    animation: float 8s ease-in-out infinite;
}

.orb-2 {
    position: absolute;
    width: clamp(150px, 30vw, 400px);
    height: clamp(150px, 30vw, 400px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 180, 184, 0.12) 0%, transparent 70%);
    bottom: 15%;
    left: 10%;
    filter: blur(50px);
    animation: float 10s ease-in-out infinite reverse;
}

.orb-3 {
    position: absolute;
    width: clamp(100px, 20vw, 300px);
    height: clamp(100px, 20vw, 300px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201, 184, 150, 0.1) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter: blur(40px);
    animation: float 12s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

/* Thin vertical accent line */
.accent-line {
    position: absolute;
    left: clamp(2rem, 5vw, 5rem);
    top: 20%;
    height: 60%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--accent-warm), transparent);
    opacity: 0;
    animation: lineIn 1.5s 0.5s var(--ease-out-expo) forwards;
}

@keyframes lineIn {
    to { opacity: 0.4; }
}

.tag {
    font-size: clamp(0.6rem, 1vw, 0.75rem);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent-warm);
    opacity: 0;
    transform: translateY(20px);
    animation: revealUp 0.8s 0.3s var(--ease-out-expo) forwards;
    margin-bottom: clamp(0.8rem, 2vh, 1.5rem);
}

h1 {
    font-family: 'Cormorant', serif;
    font-size: var(--title-size);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    max-width: 18em;
    opacity: 0;
    transform: translateY(30px);
    animation: revealUp 1s 0.5s var(--ease-out-expo) forwards;
}

h1 em {
    font-style: italic;
    color: var(--accent-pink);
}

.subtitle {
    font-size: var(--subtitle-size);
    font-weight: 300;
    color: var(--text-secondary);
    margin-top: clamp(0.8rem, 2vh, 1.5rem);
    max-width: 30em;
    opacity: 0;
    transform: translateY(20px);
    animation: revealUp 0.8s 0.7s var(--ease-out-expo) forwards;
}

.divider {
    width: 40px;
    height: 1px;
    background: var(--accent-gold);
    margin: clamp(1rem, 2.5vh, 2rem) auto;
    opacity: 0;
    animation: revealUp 0.6s 0.9s var(--ease-out-expo) forwards;
}

.credit {
    font-size: clamp(0.6rem, 0.9vw, 0.75rem);
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    opacity: 0;
    animation: revealUp 0.6s 1.1s var(--ease-out-expo) forwards;
}

@keyframes revealUp {
    to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}
</style>
</head>
<body>
<section class="slide">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>
    <div class="accent-line"></div>
    <div class="tag">Deep Learning Systems</div>
    <h1>Multi-Organ Segmentation for <em>Head & Neck Cancer</em></h1>
    <div class="divider"></div>
    <p class="subtitle">A systematic study of training strategies for 3D medical image segmentation on CT scans with 9 anatomical structures.</p>
    <p class="credit">NYU Courant &middot; PDDCA15 &middot; MONAI &middot; PyTorch</p>
</section>
</body>
</html>
